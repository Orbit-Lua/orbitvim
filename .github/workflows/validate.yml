name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - neovim: v0.11.3
          - neovim: stable

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Neovim
        env:
          NVIM_VERSION: ${{ matrix.neovim }}
        run: |
          if [ "$NVIM_VERSION" = "stable" ]; then
            url="https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz"
          else
            url="https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          fi
          curl --fail --location --output nvim.tar.gz "$url"
          sudo tar -C /opt -xzf nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify Neovim version
        run: nvim --version | head -n 1

      - name: Install StyLua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.4.0
          args: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck 1.2.0-1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Link the configuration
        run: |
          mkdir -p "$HOME/.config"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.config/nvim"

      - name: Install plugins from the lockfile
        run: |
          nvim --headless -u init.lua "+Lazy! sync" "+qall"
          lazy_root="$HOME/.local/share/nvim/lazy"
          expected_lazy="$(python3 -c 'import json; print(json.load(open("lazy-lock.json"))["lazy.nvim"]["commit"])')"
          actual_lazy="$(git -C "$lazy_root/lazy.nvim" rev-parse HEAD)"
          test "$actual_lazy" = "$expected_lazy"
          test -f "$lazy_root/plenary.nvim/plugin/plenary.vim"

      - name: Check formatting
        run: make fmt-check

      - name: Lint Lua
        run: make lint

      - name: Validate test suites
        run: make validate-test-suites

      - name: Run core tests
        timeout-minutes: 5
        run: make test-core

      - name: Smoke-test startup
        run: nvim --headless "+qall"

      - name: Run general tests
        timeout-minutes: 5
        run: make test-general
