name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - neovim: v0.11.3
            integration: false
          - neovim: stable
            integration: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Neovim
        env:
          NVIM_VERSION: ${{ matrix.neovim }}
        run: |
          if [ "$NVIM_VERSION" = "stable" ]; then
            url="https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz"
          else
            url="https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          fi
          curl --fail --location --output nvim.tar.gz "$url"
          sudo tar -C /opt -xzf nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify Neovim version
        run: nvim --version | head -n 1

      - name: Install StyLua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.4.0
          args: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks unzip
          sudo luarocks install luacheck 1.2.0-1
          python3 -m pip install --user sqlfluff==4.2.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Tree-sitter CLI
        env:
          TREE_SITTER_VERSION: 0.26.11
          TREE_SITTER_SHA256: ff1b7f9863f2faafd78dc0e66d902ee85b37f709b314b22c009f51caf233eebd
        run: |
          archive="$RUNNER_TEMP/tree-sitter-cli.zip"
          install_dir="$RUNNER_TEMP/tree-sitter-cli"
          curl --fail --location \
            --output "$archive" \
            "https://github.com/tree-sitter/tree-sitter/releases/download/v${TREE_SITTER_VERSION}/tree-sitter-cli-linux-x64.zip"
          echo "${TREE_SITTER_SHA256}  ${archive}" | sha256sum --check -
          unzip -q "$archive" -d "$install_dir"
          sudo install -m 0755 "$install_dir/tree-sitter" /usr/local/bin/tree-sitter
          tree-sitter --version

      - name: Link the configuration
        run: |
          mkdir -p "$HOME/.config"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.config/nvim"

      - name: Install plugins from the lockfile
        run: |
          mkdir -p "$HOME/.local/share/nvim/lazy"
          git clone --filter=blob:none --branch=stable \
            https://github.com/folke/lazy.nvim.git \
            "$HOME/.local/share/nvim/lazy/lazy.nvim"
          nvim --headless -u NONE \
            --cmd "set rtp^=$GITHUB_WORKSPACE" \
            --cmd "set rtp^=$HOME/.local/share/nvim/lazy/lazy.nvim" \
            -c "lua require('lazy').setup({ { import = 'plugins' } }, require('config.lazy'))" \
            -c "lua require('lazy').sync({ wait = true, show = false })" \
            -c "qall"

      - name: Check formatting
        run: make fmt-check

      - name: Lint Lua
        run: make lint

      - name: Validate test suites
        run: make validate-test-suites

      - name: Run core tests
        timeout-minutes: 5
        run: |
          nvim --headless --noplugin -u scripts/tests/minimal.vim \
            -c "PlenaryBustedDirectory lua/test/spec/ {minimal_init = 'scripts/tests/minimal.vim'}"

      - name: Smoke-test startup
        run: nvim --headless "+qall"

      - name: Install integration parsers
        if: ${{ matrix.integration }}
        run: nvim --headless -u init.lua -l lua/test/install_parsers.lua

      - name: Run integration tests
        if: ${{ matrix.integration }}
        timeout-minutes: 5
        run: make test-integration
