name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  NEOVIM_VERSION: v0.12.5
  TREE_SITTER_VERSION: 0.26.11
  STYLUA_VERSION: 2.4.0

jobs:
  validate:
    name: Validate Neovim on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install baseline Neovim
        run: |
          $name = if ($IsWindows) { 'nvim-win64' } else { 'nvim-linux-x86_64' }
          $extension = if ($IsWindows) { '.zip' } else { '.tar.gz' }
          $archive = Join-Path $env:RUNNER_TEMP ($name + $extension)
          Invoke-WebRequest "https://github.com/neovim/neovim/releases/download/$env:NEOVIM_VERSION/$name$extension" -OutFile $archive
          if ($IsWindows) {
            Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          } else {
            tar -C $env:RUNNER_TEMP -xzf $archive
            if ($LASTEXITCODE -ne 0) { throw 'Neovim extraction failed' }
          }
          Join-Path $env:RUNNER_TEMP "$name/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install StyLua
        run: |
          $platform = if ($IsWindows) { 'windows-x86_64' } else { 'linux-x86_64' }
          $checksum = if ($IsWindows) { '3803853280cb524560c6ce0d4140f6d9f02e03f55e1ce50bb4f5e51e07565794' } else { 'f9c84c210712061cb03ab8354a34a5d4f5fcf1f369d2ce916bea3ab9f7addac8' }
          $archive = Join-Path $env:RUNNER_TEMP 'stylua.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'stylua'
          Invoke-WebRequest "https://github.com/JohnnyMorganz/StyLua/releases/download/v$env:STYLUA_VERSION/stylua-$platform.zip" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $checksum) { throw 'StyLua checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          if (!$IsWindows) {
            chmod +x (Join-Path $directory 'stylua')
            if ($LASTEXITCODE -ne 0) { throw 'StyLua permission setup failed' }
          }
          $directory | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Linux validation tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck 1.2.0-1

      - name: Install Windows Luacheck
        if: runner.os == 'Windows'
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'luacheck'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $executable = Join-Path $directory 'luacheck.exe'
          Invoke-WebRequest 'https://github.com/lunarmodules/luacheck/releases/download/v1.2.0/luacheck.exe' -OutFile $executable
          if ((Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash -ne '0f1c69c4d09f1ebb4d8df14c215e4553e2e639bd4cb7bf3c639b0daa6198317b') {
            throw 'Luacheck checksum mismatch'
          }
          $directory | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Prepare Windows native build tools
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: make mingw-w64-ucrt-x86_64-gcc

      - name: Expose Windows native build tools
        if: runner.os == 'Windows'
        run: |
          $toolRoot = '${{ steps.msys2.outputs.msys2-location }}'
          Join-Path $toolRoot 'ucrt64/bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          Join-Path $toolRoot 'usr/bin' | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install integration services
        run: |
          python -m pip install sqlfluff==4.2.2
          if ($LASTEXITCODE -ne 0) { throw 'SQLFluff installation failed' }
          $serverRoot = Join-Path $env:RUNNER_TEMP 'json-lsp'
          npm install --prefix $serverRoot --no-audit --no-fund vscode-langservers-extracted@4.10.0
          if ($LASTEXITCODE -ne 0) { throw 'JSON language server installation failed' }
          Join-Path $serverRoot 'node_modules/.bin' | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Tree-sitter CLI
        run: |
          $platform = if ($IsWindows) { 'windows-x64' } else { 'linux-x64' }
          $checksum = if ($IsWindows) { 'd40e158839062803a5182ecefca76f809b89464146625d303ef779ed8ceb0f73' } else { 'ff1b7f9863f2faafd78dc0e66d902ee85b37f709b314b22c009f51caf233eebd' }
          $archive = Join-Path $env:RUNNER_TEMP 'tree-sitter-cli.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'tree-sitter-cli'
          Invoke-WebRequest "https://github.com/tree-sitter/tree-sitter/releases/download/v$env:TREE_SITTER_VERSION/tree-sitter-cli-$platform.zip" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $checksum) { throw 'Tree-sitter checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          if (!$IsWindows) {
            chmod +x (Join-Path $directory 'tree-sitter')
            if ($LASTEXITCODE -ne 0) { throw 'Tree-sitter permission setup failed' }
          }
          $directory | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Link the configuration
        run: |
          $config = if ($IsWindows) { Join-Path $env:LOCALAPPDATA 'nvim' } else { Join-Path $HOME '.config/nvim' }
          $data = if ($IsWindows) { Join-Path $env:LOCALAPPDATA 'nvim-data' } else { Join-Path $HOME '.local/share/nvim' }
          New-Item -ItemType Directory -Path (Split-Path -Parent $config) -Force | Out-Null
          $linkType = if ($IsWindows) { 'Junction' } else { 'SymbolicLink' }
          New-Item -ItemType $linkType -Path $config -Target $env:GITHUB_WORKSPACE | Out-Null
          "NVIM_DATA_PATH=$data" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache plugins and parsers
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.NVIM_DATA_PATH }}/lazy
            ${{ env.NVIM_DATA_PATH }}/site
          key: nvim-${{ runner.os }}-${{ env.NEOVIM_VERSION }}-${{ hashFiles('lazy-lock.json', 'scripts/tests/restore_plugins.lua', 'scripts/tests/install_parsers.lua', 'justfile', '.github/workflows/validate.yml') }}

      - name: Restore and verify locked plugins
        run: just deps

      - name: Build and execute native dependencies
        run: just test-build

      - name: Install integration parsers
        run: just parsers

      - name: Check Lua and run core tests
        run: just all

      - name: Test parsers, snippets and language services
        run: just test-integration

      - name: Verify locked-plugin startup
        run: just smoke
