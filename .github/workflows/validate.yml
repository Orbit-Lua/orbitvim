name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  NEOVIM_VERSION: v0.12.5

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install baseline Neovim
        run: |
          curl --fail --location --remote-name "https://github.com/neovim/neovim/releases/download/${NEOVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          sudo tar -C /opt -xzf nvim-linux-x86_64.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install StyLua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.4.0
          args: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks unzip
          sudo luarocks install luacheck
          pipx install sqlfluff==4.2.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Tree-sitter CLI
        env:
          TREE_SITTER_VERSION: 0.26.11
          TREE_SITTER_SHA256: ff1b7f9863f2faafd78dc0e66d902ee85b37f709b314b22c009f51caf233eebd
        run: |
          archive="$RUNNER_TEMP/tree-sitter-cli.zip"
          install_dir="$RUNNER_TEMP/tree-sitter-cli"
          curl --fail --location \
            --output "$archive" \
            "https://github.com/tree-sitter/tree-sitter/releases/download/v${TREE_SITTER_VERSION}/tree-sitter-cli-linux-x64.zip"
          echo "${TREE_SITTER_SHA256}  ${archive}" | sha256sum --check -
          unzip -q "$archive" -d "$install_dir"
          sudo install -m 0755 "$install_dir/tree-sitter" /usr/local/bin/tree-sitter
          tree-sitter --version

      - name: Link the configuration
        run: |
          mkdir -p "$HOME/.config"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.config/nvim"

      - name: Cache plugins and parsers
        id: nvim-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/nvim/lazy
            ~/.local/share/nvim/site
          key: nvim-linux-${{ env.NEOVIM_VERSION }}-${{ hashFiles('lazy-lock.json', 'scripts/tests/install_parsers.lua') }}

      # restore checks out the lockfile commits; sync would update past them.
      - name: Install plugins from the lockfile
        if: steps.nvim-cache.outputs.cache-hit != 'true'
        run: |
          lazy_dir="$HOME/.local/share/nvim/lazy/lazy.nvim"
          git clone --filter=blob:none https://github.com/folke/lazy.nvim.git "$lazy_dir"
          git -C "$lazy_dir" checkout --detach "$(jq -r '."lazy.nvim".commit' lazy-lock.json)"
          nvim --headless -u NONE \
            --cmd "set rtp^=$GITHUB_WORKSPACE" \
            --cmd "set rtp^=$lazy_dir" \
            -c "lua require('lazy').setup({ { import = 'plugins' } }, require('config.lazy'))" \
            -c "Lazy! restore" \
            -c "qall"

      - name: Install integration parsers
        run: nvim --headless -u init.lua -l scripts/tests/install_parsers.lua

      - name: Run core validation
        run: just all

      - name: Run integration tests
        run: just test-integration

      - name: Smoke-test startup
        run: nvim --headless "+qall"

  windows-core:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install baseline Neovim
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nvim.zip'
          Invoke-WebRequest "https://github.com/neovim/neovim/releases/download/$env:NEOVIM_VERSION/nvim-win64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'nvim-win64/bin' | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Cache core-test dependencies
        id: nvim-cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\nvim-data\lazy
          key: nvim-windows-core-${{ hashFiles('lazy-lock.json') }}

      - name: Install locked core-test dependencies
        if: steps.nvim-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $pluginRoot = Join-Path $env:LOCALAPPDATA 'nvim-data/lazy'
          New-Item -ItemType Directory -Path $pluginRoot -Force | Out-Null
          $lock = Get-Content -LiteralPath lazy-lock.json -Raw | ConvertFrom-Json
          $repositories = @{
            'plenary.nvim' = 'nvim-lua/plenary.nvim'
            'nui.nvim' = 'MunifTanjim/nui.nvim'
          }
          foreach ($name in $repositories.Keys) {
            $target = Join-Path $pluginRoot $name
            git clone --filter=blob:none "https://github.com/$($repositories[$name]).git" $target
            if ($LASTEXITCODE -ne 0) { throw "clone failed: $name" }
            git -C $target checkout --detach $lock.$name.commit
            if ($LASTEXITCODE -ne 0) { throw "locked checkout failed: $name" }
          }

      - name: Run Windows core tests
        run: just test-core
